services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schemaforge}
      POSTGRES_USER: ${POSTGRES_USER:-schemaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      # Read by docker/postgres-init/01-create-app-role.sh - a restricted, non-superuser role the
      # running app connects as, so Postgres RLS actually applies to it (superusers always bypass
      # RLS regardless of FORCE ROW LEVEL SECURITY). POSTGRES_USER above is the migration/DDL role.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-schemaforge_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-changeme-local-only-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schemaforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schemaforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SchemaForge.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # The restricted app role, not the migration superuser (POSTGRES_USER) - see the postgres
      # service's comment above. Migrations are applied separately via `dotnet ef database
      # update`, which does use the superuser connection string.
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-schemaforge};Username=${POSTGRES_APP_USER:-schemaforge_app};Password=${POSTGRES_APP_PASSWORD:-changeme-local-only-app}"
      ConnectionStrings__Redis: "redis:6379"
      Storage__Endpoint: "http://minio:9000"
      Storage__AccessKey: ${MINIO_ROOT_USER:-schemaforge}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-changeme-local-only}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-changeme-local-only-minimum-32-characters}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
